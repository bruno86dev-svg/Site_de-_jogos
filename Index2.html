
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Escola Virtual</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  font-size: 16px;
  background-color: #eef1f5;
  color: #333333;
  min-height: 100vh;
}

h1 {
  background-color: #1a2f45;
  color: #ffffff;
  text-align: center;
  padding: 30px 20px;
  font-size: 32px;
  letter-spacing: 3px;
}

h2 {
  text-align: center;
  color: #1a2f45;
  margin: 40px 0 30px;
  font-size: 22px;
  letter-spacing: 1px;
}

form {
  width: 90%;
  max-width: 960px;
  margin: 0 auto 60px auto;
  background-color: #ffffff;
  padding: 50px 60px;
  border-radius: 10px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
}

fieldset {
  border: 2px solid #1a2f45;
  border-radius: 8px;
  padding: 30px 35px;
  margin-bottom: 35px;
}

legend {
  background-color: #1a2f45;
  color: #ffffff;
  padding: 7px 18px;
  border-radius: 5px;
  font-size: 15px;
  letter-spacing: 1px;
}

.campo-grupo {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px 40px;
  margin-bottom: 20px;
}



.campo {
  display: flex;
  flex-direction: column;
  margin-bottom: 20px;
}

label {
  display: inline-block;
  margin-bottom: 8px;
  font-weight: bold;
  color: #1a2f45;
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

input[type="text"],
input[type="email"],
input[type="date"] {
  padding: 10px 14px;
  border: 1px solid #cccccc;
  border-radius: 5px;
  font-size: 15px;
  background-color: #fafafa;
  transition: border-color 0.3s, box-shadow 0.3s;
}

.campo input[type="text"],
.campo input[type="email"],
.campo input[type="date"] {
  width: 100%;
}

input[type="text"]:focus,
input[type="email"]:focus,
input[type="date"]:focus {
  border-color: #1a2f45;
  box-shadow: 0 0 0 3px rgba(26, 47, 69, 0.1);
  outline: none;
  background-color: #ffffff;
}




select {
  padding: 10px 14px;
  border: 1px solid #cccccc;
  border-radius: 5px;
  font-size: 15px;
  background-color: #fafafa;
  cursor: pointer;
  width: 100%;
  transition: border-color 0.3s;
}

select:focus {
  border-color: #1a2f45;
  outline: none;
}

table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
}

td {
  padding: 15px 20px;
  vertical-align: top;
  border-right: 1px solid #e0e0e0;
  width: 33.33%;
}

td:last-child {
  border-right: none;
}

td > b,
td > strong {
  display: block;
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: #1a2f45;
  margin-bottom: 12px;
}

input[type="radio"],
input[type="checkbox"] {
  margin-right: 8px;
  cursor: pointer;
  accent-color: #1a2f45;
  width: 15px;
  height: 15px;
}

td label {
  text-transform: none;
  letter-spacing: 0;
  font-weight: normal;
  font-size: 15px;
  display: inline;
  margin-bottom: 0;
}

td br + input {
  margin-top: 8px;
}

/* =============================================
   BOTÕES
============================================= */
.botoes {
  display: flex;
  gap: 15px;
  margin-top: 10px;
}

input[type="submit"] {
  background-color: #27ae60;
  color: #ffffff;
  border: none;
  padding: 12px 35px;
  border-radius: 5px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: background-color 0.3s, transform 0.1s;
}

input[type="submit"]:hover  { background-color: #1e8449; }
input[type="submit"]:active { transform: scale(0.98); }

input[type="reset"] {
  background-color: #ffffff;
  color: #e74c3c;
  border: 2px solid #e74c3c;
  padding: 12px 35px;
  border-radius: 5px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: background-color 0.3s, color 0.3s, transform 0.1s;
}

input[type="reset"]:hover  { background-color: #e74c3c; color: #ffffff; }
input[type="reset"]:active { transform: scale(0.98); }

/* Adicionado para suportar grid de 3 colunas no endereço */
.campo-grupo-3 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 20px 40px;
  margin-bottom: 20px;
}

/* Campo readonly preenchido pelo CEP */
input[readonly] {
  background-color: #f0f4f8;
  color: #555;
  cursor: not-allowed;
}

/* Status de retorno da busca do CEP */
#cep-status {
  font-size: 13px;
  margin-top: 5px;
  min-height: 18px;
}

#cep-status.erro       { color: #e74c3c; }
#cep-status.sucesso    { color: #27ae60; }
#cep-status.carregando { color: #999; font-style: italic; }

/* Animação compartilhada pelos blocos dinâmicos */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Bloco de segunda língua (5º ano) */
#bloco-segunda-lingua {
  display: none;
  margin-top: 20px;
  padding: 20px 25px;
  background-color: #f0f6ff;
  border: 2px dashed #1a2f45;
  border-radius: 8px;
  animation: fadeIn 0.3s ease;
}

#bloco-segunda-lingua p {
  font-size: 14px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: #1a2f45;
  margin-bottom: 14px;
}

.opcao-lingua {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
  font-size: 15px;
  color: #333;
  cursor: pointer;
}

.opcao-lingua input[type="radio"] {
  accent-color: #1a2f45;
  width: 16px;
  height: 16px;
  margin-right: 0;
  cursor: pointer;
}

.opcao-lingua label {
  text-transform: none;
  letter-spacing: 0;
  font-weight: normal;
  font-size: 15px;
  color: #333;
  cursor: pointer;
  margin-bottom: 0;
}

.flag {
  font-size: 20px;
  line-height: 1;
}

/* Bloco de telefone de contato (turno tarde) */
#bloco-telefone-tarde {
  display: none;
  margin-top: 16px;
  padding: 16px 20px;
  background-color: #fff8f0;
  border: 2px dashed #e67e22;
  border-radius: 8px;
  animation: fadeIn 0.3s ease;
}

#bloco-telefone-tarde p {
  font-size: 13px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: #e67e22;
  margin-bottom: 10px;
}

#bloco-telefone-tarde input[type="text"] {
  width: 100%;
  padding: 9px 13px;
  border: 1px solid #e67e22;
  border-radius: 5px;
  font-size: 15px;
  background-color: #fff;
  transition: border-color 0.3s, box-shadow 0.3s;
}

#bloco-telefone-tarde input[type="text"]:focus {
  border-color: #d35400;
  box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.15);
  outline: none;
}

input[type="submit"]:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
</style>
</head>

<body>

  <h1>Escola Virtual</h1>
  <h2>Formulário de Pré-Matrícula</h2>

  <form action="" method="post">

    <!-- ========== DADOS PESSOAIS ========== -->
    <fieldset>
      <legend><strong>Dados Pessoais</strong></legend>

      <div class="campo-grupo">
        <div class="campo">
          <label for="nome_aluno">Nome do Aluno</label>
          <input type="text" id="nome_aluno" name="nome_aluno" required>
        </div>
        <div class="campo">
          <label for="email">E-Mail</label>
          <input type="email" id="email" name="email">
        </div>
      </div>

      <div class="campo-grupo">
        <div class="campo">
          <label for="nome_mae">Nome da Mãe</label>
          <input type="text" id="nome_mae" name="nome_mae">
        </div>
        <div class="campo">
          <label for="nome_pai">Nome do Pai</label>
          <input type="text" id="nome_pai" name="nome_pai">
        </div>
      </div>

      <div class="campo-grupo">
        <div class="campo">
          <label for="nascimento">Nascimento</label>
          <input type="date" id="nascimento" name="nascimento">
        </div>
        <div class="campo">
          <label for="telefone">Telefone</label>
          <input type="text" id="telefone" name="telefone" maxlength="15" placeholder="(61) 9 9999-9999">
        </div>
      </div>

      <div class="campo-grupo">
        <div class="campo">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" name="cpf" maxlength="14" placeholder="000.000.000-00">
        </div>
        <div class="campo">
          <label for="cep">CEP</label>
          <input type="text" id="cep" name="cep" maxlength="9" placeholder="00000-000">
          <span id="cep-status"></span>
        </div>
      </div>

      <div class="campo-grupo">
        <div class="campo">
          <label for="cpf">Matricula</label>
          <input type="text" id="cpf" name="cpf" maxlength="14" placeholder="000.000.000-00">
        </div>
        <div class="campo">
          <label for="cep">Idade</label>
          <input type="text" id="idade" name="idade" maxlength="9" placeholder="dd/mm/yyyy" readonly>
          <span id="cep-status"></span>
        </div>
      </div>

      <div class="campo-grupo">
        <div class="campo">
          <label for="estado">Estado</label>
          <select id="estado" name="estado">
            <option value="">Selecione o estado</option>
          </select>
        </div>
        <div class="campo">
          <label for="cidade">Cidade</label>
          <select id="cidade" name="cidade" disabled>
            <option value="">Selecione primeiro o estado</option>
          </select>
        </div>
      </div>


    </fieldset>

    <!-- ========== ENDEREÇO ========== -->
    <fieldset>
      <legend><strong>Endereço</strong></legend>

      <div class="campo-grupo">
        <div class="campo">
          <label for="logradouro">Logradouro</label>
          <input type="text" id="logradouro" name="logradouro" readonly>
        </div>
        <div class="campo">
          <label for="numero">Número</label>
          <input type="text" id="numero" name="numero" placeholder="Ex: 123">
        </div>
      </div>

      <div class="campo-grupo">
        <div class="campo">
          <label for="complemento">Complemento</label>
          <input type="text" id="complemento" name="complemento" placeholder="Apto, Bloco...">
        </div>
        <div class="campo">
          <label for="bairro">Bairro</label>
          <input type="text" id="bairro" name="bairro" readonly>
        </div>
      </div>

      <div class="campo-grupo-3">
        <div class="campo">
          <label for="cidade">Cidade</label>
          <input type="text" id="cidade" name="cidade" readonly>
        </div>
        <div class="campo">
          <label for="estado">Estado</label>
          <input type="text" id="estado" name="estado" readonly>
        </div>
        <div class="campo">
          <label for="ibge">Código IBGE</label>
          <input type="text" id="ibge" name="ibge" readonly>
        </div>
      </div>

    </fieldset>

    <!-- ========== INFORMAÇÕES DE MATRÍCULA ========== -->
    <fieldset>
      <legend><strong>Informações de Matrícula</strong></legend>

      <table>
        <tr valign="top">

          <!-- COLUNA: SÉRIE -->
          <td>
            <strong>Série</strong>
            <select id="serie" name="serie">
              <option value="">-- Selecione --</option>
              <option value="pre-escolar">Pré-escolar</option>
              <option value="1ano">1º ano</option>
              <option value="2ano">2º ano</option>
              <option value="3ano">3º ano</option>
              <option value="4ano">4º ano</option>
              <option value="5ano">5º ano</option>
            </select>

            <!-- ========== NOVO ========== -->
            <!-- Bloco segunda língua: só no 5º ano -->
            <div id="bloco-segunda-lingua">
              <p>Segunda Língua</p>
              <div class="opcao-lingua">
                <input type="radio" id="lingua_ingles" name="segunda_lingua" value="ingles">
                <span class="flag">🇺🇸</span>
                <label for="lingua_ingles">Inglês</label>
              </div>
              <div class="opcao-lingua">
                <input type="radio" id="lingua_espanhol" name="segunda_lingua" value="espanhol">
                <span class="flag">🇪🇸</span>
                <label for="lingua_espanhol">Espanhol</label>
              </div>
            </div>
          </td>

          <!-- COLUNA: TURNO -->
          <td>
            <strong>Turno</strong>
            <input type="radio" name="turno" id="manha" value="manha">
            <label for="manha">Manhã</label><br>
            <input type="radio" name="turno" id="tarde" value="tarde">
            <label for="tarde">Tarde</label>

            <!-- ========== NOVO ========== -->
            <!-- Bloco telefone de contato: só no turno tarde -->
            <div id="bloco-telefone-tarde">
              <p>📞 Telefone de Contato para o Turno da Tarde</p>
              <input type="text" id="telefone_tarde" name="telefone_tarde" maxlength="15"
                placeholder="(61) 9 9999-9999">
            </div>
          </td>

          <!-- COLUNA: ATIVIDADES -->
          <td>
            <strong>Atividades Extracurriculares</strong>
            <input type="checkbox" name="atividades" id="informatica" value="informatica">
            <label for="informatica">Informática</label><br>

            <input type="checkbox" name="atividades" id="musica" value="musica">
            <label for="musica">Música</label><br>

            <input type="checkbox" name="atividades" id="balet" value="balet">
            <label for="balet">Balet</label><br>

            <input type="checkbox" name="atividades" id="pintura" value="pintura">
            <label for="pintura">Pintura</label><br>

            <input type="checkbox" name="atividades" id="judo" value="judo">
            <label for="judo">Judô</label><br>

            <input type="checkbox" name="atividades" id="futebol" value="futebol">
            <label for="futebol">Futebol</label>
          </td>

        </tr>
      </table>
    </fieldset>

    <div class="botoes">
      <input type="submit" id="btn-enviar" value="Enviar Formulário" disabled>
      <input type="reset" value="Limpar Campos" id="btn-reset">
    </div>

  </form>

  <script>

// =============================================
// MÁSCARA DE CEP
// =============================================
const campoCep = document.getElementById('cep');

campoCep.addEventListener('input', function () {
  let valor = this.value.replace(/\D/g, '');
  if (valor.length > 5) {
    valor = valor.slice(0, 5) + '-' + valor.slice(5, 8);
  }
  this.value = valor;

  const status = document.getElementById('cep-status');
  status.textContent = '';
  status.className = '';
});

// =============================================
// MÁSCARA DE CPF
// =============================================
document.getElementById('cpf').addEventListener('input', function (e) {
  let value = e.target.value.replace(/\D/g, ''); // remove tudo que não é dígito

  if (value.length <= 11) {
    value = value
      .replace(/(\d{3})(\d)/, '$1.$2')
      .replace(/(\d{3})(\d)/, '$1.$2')
      .replace(/(\d{3})(\d{1,2})$/, '$1-$2');
  }

  e.target.value = value;
});
  </script>

</body>

</html>
