<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Formulário de Pré-Matrícula</title>
<link rel="stylesheet" href="aula03.css">
</head>
<body>

<h1>Formulário de Pré-Matrícula</h1>

<form>
  <fieldset>
    <legend>Dados Pessoais</legend>

    <div class="grid">
      <div class="field">
        <label for="nome">Nome do Aluno</label>
        <input type="text" id="nome" name="nome">
      </div>

      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email">
      </div>

      <div class="field">
        <label for="mae">Nome da Mãe</label>
        <input type="text" id="mae" name="mae">
      </div>

      <div class="field">
        <label for="pai">Nome do Pai</label>
        <input type="text" id="pai" name="pai">
      </div>

      <div class="field">
        <label for="nascimento">Nascimento</label>
        <input type="date" id="nascimento" name="nascimento" placeholder="dd/mm/aaaa">
      </div>

      <div class="field">
        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(61) 9 9999-9999">
      </div>
    </div>
  </fieldset>

  <fieldset>
    <legend>Informações de Matrícula</legend>

    <div class="matricula-row">
      <div class="serie-col">
        <label for="serie">Série</label>
        <select id="serie" name="serie">
          <option>Pré-escolar</option>
          <option>1º Ano</option>
          <option>2º Ano</option>
          <option>3º Ano</option>
          <option>4º Ano</option>
          <option>5º Ano</option>
        </select>
      </div>

      <div class="turno-col">
        <span class="group-title">Turno</span>
        <label><input type="radio" name="turno" value="manha"> Manhã</label>
        <label><input type="radio" name="turno" value="tarde"> Tarde</label>
      </div>

      <div class="extra-col">
        <span class="group-title">Atividades Extracurriculares</span>
        <label><input type="checkbox" name="atividades" value="informatica"> Informática</label>
        <label><input type="checkbox" name="atividades" value="musica"> Música</label>
        <label><input type="checkbox" name="atividades" value="bale"> Balé</label>
        <label><input type="checkbox" name="atividades" value="pintura"> Pintura</label>
        <label><input type="checkbox" name="atividades" value="judo"> Judô</label>
        <label><input type="checkbox" name="atividades" value="futebol"> Futebol</label>
      </div>
    </div>
  </fieldset>

  <div class="buttons">
    <button type="submit" class="btn-enviar">Enviar</button>
    <button type="reset" class="btn-limpar">Limpar Campos</button>
  </div>
</form>

</body>
</html>
