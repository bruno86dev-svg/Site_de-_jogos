<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Escola Virtual - Pré-Matrícula</title>
<link rel="stylesheet" href="aula.css">

</head>
<body>

  <h1 align="center">Escola Virtual</h1>
  <h2 align="center">Formulário de Pré-Matrícula</h2>
  <hr>

  <form action="#" method="post">
    <p>Dados pessoais:</p>
    <label for="nome">Nome do aluno :</label>  <p><input type="text" id="nome" name="nome" required><br><br></p>   
    <label for="telefone">data de nascimento :</label>
    <p><input type="tel" id="telefone" name="telefone" required><br><br></p>
    <label for="nome da mãe">Nome da mãe :</label>
    <p><input type="text" id="nome da mãe" name="nome da mãe" required><br><br></p>
    <label for="nome do pai ">Nome do pai :</label>
    <p><input type="text" id="nome do pai " name="nome do pai " required><br><br></p>
    <label for="email">E-mail:</label>
    <p><input type="email" id="email" name="email" required><br><br></p>
    <label for="endereco">Endereço:</label>
        <p><input type="text" id="endereco" name="endereco" required><br><br></p>

    <br>

    <div align="center">
      <input type="submit" value="Envia Formulário">
      <input type="reset" value="Limpa Campos">
    </div>

  </form>

</body>
</html>
